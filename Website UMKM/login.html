<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Danly Swarz Waha Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-container {
      background: white;
      padding: 3rem 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: #667eea;
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #999;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #e74c3c;
      background: #fadbd8;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .success {
      color: #27ae60;
      background: #d5f4e6;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .info {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #666;
    }

    .info strong {
      color: #333;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="index.html" class="back-link">← Kembali ke Portfolio</a>
    
    <h1>Login</h1>
    <p class="subtitle">Masuk ke akun kamu</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="danly@test.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="123456" required>
      </div>

      <button type="submit" id="loginBtn">Login</button>
    </form>

    <div class="info">
      <strong>Email test:</strong> danly@test.com<br>
      <strong>Password:</strong> 123456
    </div>
  </div>

  <!-- Firebase SDK v9+ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDkNkVYGqdCd-G7kLYhQz8gyMHtVu1",
      authDomain: "swarz-portfolio.firebaseapp.com",
      projectId: "swarz-portfolio",
      storageBucket: "swarz-portfolio.firebasestorage.app",
      messagingSenderId: "99858246170",
      appId: "1:99858246178:web:ec1e8ebd656f61aabbdc"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Sedang login...';

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          successMsg.style.display = 'block';
          successMsg.textContent = '✓ Login berhasil! Redirect ke portfolio...';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        })
        .catch((error) => {
          errorMsg.style.display = 'block';

          if (error.code === 'auth/user-not-found') {
            errorMsg.textContent = 'Email tidak ditemukan.';
          } else if (error.code === 'auth/wrong-password') {
            errorMsg.textContent = 'Password salah.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg.textContent = 'Format email tidak valid.';
          } else {
            errorMsg.textContent = 'Error: ' + error.message;
          }

          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        });
    });
  </script>

</body>
</html>
